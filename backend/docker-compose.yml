# Default local mode needs neither Redis nor PostgreSQL.
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      VOLCENGINE_API_KEY: ${VOLCENGINE_API_KEY:-}
      VOLCENGINE_ENDPOINT: ${VOLCENGINE_ENDPOINT:-https://ark.cn-beijing.volces.com/api/v3/chat/completions}
      VOLCENGINE_MODEL: ${VOLCENGINE_MODEL:-}
      MODEL_CONNECT_TIMEOUT_SECONDS: ${MODEL_CONNECT_TIMEOUT_SECONDS:-10}
      MODEL_READ_TIMEOUT_SECONDS: ${MODEL_READ_TIMEOUT_SECONDS:-60}
      MODEL_WRITE_TIMEOUT_SECONDS: ${MODEL_WRITE_TIMEOUT_SECONDS:-30}
      MODEL_POOL_TIMEOUT_SECONDS: ${MODEL_POOL_TIMEOUT_SECONDS:-10}
      MODEL_MAX_CONNECTIONS: ${MODEL_MAX_CONNECTIONS:-20}
      MODEL_JSON_REPAIR_ATTEMPTS: ${MODEL_JSON_REPAIR_ATTEMPTS:-1}
      CHAT_STREAM_TIMEOUT_SECONDS: ${CHAT_STREAM_TIMEOUT_SECONDS:-120}
      PREFERENCE_SQLITE_PATH: /app/data/preferences.sqlite3
    volumes:
      - local_data:/app/data

  # Evaluation-only infrastructure: enabling this profile does NOT switch app storage.
  # No data migration or automatic failover is performed.
  db:
    profiles: [optional-infra]
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: smartprice
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    profiles: [optional-infra]
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  local_data:
  postgres_data:
